<VirtualHost *:80>
    ServerName ddev.site
    ServerAlias *.ddev.site

    ProxyRequests off
    ProxyPreserveHost on
    ProxyPass / http://127.0.0.1:33000/
    ProxyPassReverse / http://127.0.0.1:33000/
</VirtualHost>
<VirtualHost *:443>
    ServerName ddev.site
    ServerAlias *.ddev.site

    Use AutoSsl kclie-ddev
    SSLProxyEngine on
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    ProxyRequests off
    ProxyPreserveHost on
    ProxyPass / https://127.0.0.1:33001/
    ProxyPassReverse / https://127.0.0.1:33001/
</VirtualHost>