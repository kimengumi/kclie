<Directory />
    Require ip 127.0.0.0/8
    Require ip ::1/128
</Directory>

<Macro DevPhpVhost $(phpnb) $(vhostname) $(dir)>
    <Virtualhost *:80>
        ServerName $(vhostname).dev.localhost
        DocumentRoot $(dir)
        Use PhpFpmPool php$(phpnb)-fpm
    </VirtualHost>
    <Virtualhost *:443>
        ServerName $(vhostname).dev.localhost
        DocumentRoot $(dir)
        Use PhpFpmPool php$(phpnb)-fpm
        Use AutoSsl kclie-dev-multi-fpm
    </VirtualHost>
    <Directory $(dir)>
        AllowOverride All
        Options +Indexes +FollowSymLinks
    </Directory>
</Macro>

# retro-compatibility for previous macro
<Macro DevPhpFpmVhost $(phpnb) $(fullvhostname) $(dir)>
    <Virtualhost *:80>
        ServerName $(fullvhostname)
        DocumentRoot $(dir)
        Use PhpFpmPool php$(phpnb)-fpm
    </VirtualHost>
    <Virtualhost *:443>
        ServerName $(fullvhostname)
        DocumentRoot $(dir)
        Use PhpFpmPool php$(phpnb)-fpm
        Use AutoSsl $(fullvhostname)
    </VirtualHost>
    <Directory $(dir)>
        AllowOverride All
        Options +Indexes +FollowSymLinks
    </Directory>
</Macro>
