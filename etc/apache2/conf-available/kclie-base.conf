# Global config
serverName localhost
ServerAdmin webmaster.at.localhost.com

# deny hidden files/dirs except .well-known
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>
<DirectoryMatch "(^|/)\.(?!well-known(/|$))[^/]+(/|$)">
    Require all denied
</DirectoryMatch>

# deny usual files
<FilesMatch "^(AGENTS|CLAUDE|COPILOT|GEMINI|README)\.md$">
    Require all denied
</FilesMatch>
<FilesMatch "^(composer\.(json|lock|phar))$">
    Require all denied
</FilesMatch>
<FilesMatch "^(docker|Docker).*$">
    Require all denied
</FilesMatch>
<FilesMatch "^(package\.(json|lock))$">
    Require all denied
</FilesMatch>

<Macro PhpFpmPool $(poolsocket)>
    <FilesMatch ".+\.phps$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.ph(?:ar|p|ps|tml)$">
        Require all denied
    </FilesMatch>
    <IfModule setenvif_module>
        SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
    </IfModule>
    <IfModule proxy_fcgi_module>
        <FilesMatch ".+\.ph(?:ar|p|tml)$">
            SetHandler "proxy:unix:/run/php/$(poolsocket).sock|fcgi://localhost"
        </FilesMatch>
    </IfModule>
</Macro>

<Macro AutoSsl $(name)>
    <IfModule mod_ssl.c>
        SSLEngine on
        <FilesMatch "\.(cgi|shtml|phtml|php)$">
            SSLOptions +StdEnvVars
        </FilesMatch>
        # KCLIE Acme.sh wrapper
        <IfFile /etc/acme.sh/$(name)_ecc/fullchain.cer>
            SSLCertificateFile /etc/acme.sh/$(name)_ecc/fullchain.cer
            SSLCertificateKeyFile /etc/acme.sh/$(name)_ecc/$(name).key
        </IfFile>
        <IfFile !/etc/acme.sh/$(name)_ecc/fullchain.cer>
            <IfFile /etc/acme.sh/$(name)/fullchain.cer>
                SSLCertificateFile /etc/acme.sh/$(name)/fullchain.cer
                SSLCertificateKeyFile /etc/acme.sh/$(name)/$(name).key
            </IfFile>
        </IfFile>
        # standalone Acme.sh Retrocompatibility
        <IfFile !/etc/acme.sh/$(name)_ecc/fullchain.cer>
            <IfFile !/etc/acme.sh/$(name)/fullchain.cer>
                <IfFile /root/.acme.sh/$(name)_ecc/fullchain.cer>
                    SSLCertificateFile /root/.acme.sh/$(name)_ecc/fullchain.cer
                    SSLCertificateKeyFile /root/.acme.sh/$(name)_ecc/$(name).key
                </IfFile>
            </IfFile>
        </IfFile>
        <IfFile !/etc/acme.sh/$(name)_ecc/fullchain.cer>
            <IfFile !/etc/acme.sh/$(name)/fullchain.cer>
                <IfFile !/root/.acme.sh/$(name)_ecc/fullchain.cer>
                    <IfFile /root/.acme.sh/$(name)/fullchain.cer>
                        SSLCertificateFile /root/.acme.sh/$(name)/fullchain.cer
                        SSLCertificateKeyFile /root/.acme.sh/$(name)/$(name).key
                    </IfFile>
                </IfFile>
            </IfFile>
        </IfFile>
        # standalone manual SSL (one folder by name)
        <IfFile !/etc/acme.sh/$(name)_ecc/fullchain.cer>
            <IfFile !/etc/acme.sh/$(name)/fullchain.cer>
                <IfFile !/root/.acme.sh/$(name)_ecc/fullchain.cer>
                    <IfFile !/root/.acme.sh/$(name)/fullchain.cer>
                        <IfFile /etc/ssl/$(name)/fullchain.cer>
                            SSLCertificateFile    /etc/ssl/$(name)/fullchain.cer
                            SSLCertificateKeyFile /etc/ssl/$(name)/private.key
                        </IfFile>
                    </IfFile>
                </IfFile>
            </IfFile>
        </IfFile>
        # standalone manual SSL (common certs/private folders)
        <IfFile !/etc/acme.sh/$(name)_ecc/fullchain.cer>
            <IfFile !/etc/acme.sh/$(name)/fullchain.cer>
                <IfFile !/root/.acme.sh/$(name)_ecc/fullchain.cer>
                    <IfFile !/root/.acme.sh/$(name)/fullchain.cer>
                        <IfFile !/etc/ssl/$(name)/fullchain.cer>
                            <IfFile /etc/ssl/certs/$(name).pem>
                                SSLCertificateFile    /etc/ssl/certs/$(name).pem
                                SSLCertificateKeyFile /etc/ssl/private/$(name).key
                            </IfFile>
                        </IfFile>
                    </IfFile>
                </IfFile>
            </IfFile>
        </IfFile>
        # default Snake SSL
        <IfFile !/etc/acme.sh/$(name)_ecc/fullchain.cer>
            <IfFile !/etc/acme.sh/$(name)/fullchain.cer>
                <IfFile !/root/.acme.sh/$(name)_ecc/fullchain.cer>
                    <IfFile !/root/.acme.sh/$(name)/fullchain.cer>
                        <IfFile !/etc/ssl/$(name)/fullchain.cer>
                            <IfFile !/etc/ssl/certs/$(name).pem>
                                <IfFile "/etc/ssl/certs/ssl-cert-snakeoil.pem">
                                    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
                                    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
                                </IfFile>
                            </IfFile>
                        </IfFile>
                    </IfFile>
                </IfFile>
            </IfFile>
        </IfFile>
    </IfModule>
</Macro>